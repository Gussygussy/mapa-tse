<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Eleições 2026</title>
<meta name="description" content="Mapa interativo dos resultados do 1º turno das eleições gerais de 2026 (dados do TSE).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>
<canvas id="overlay"></canvas>

<div id="loading" class="loading"><div class="spinner"></div><span id="loading-text">Carregando mapa…</span></div>

<nav id="levels" class="levels" aria-label="Nível do mapa">
  <button data-level="pais">País</button>
  <button data-level="estado" class="active">Estado</button>
  <button data-level="municipio">Município</button>
  <button data-level="zona">Zona</button>
  <button data-level="secao">Seção</button>
</nav>


<form id="geosearch" class="geosearch" role="search" autocomplete="off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <input type="search" id="geosearch-q" placeholder="Buscar endereço (OpenStreetMap) e Enter" aria-label="Buscar endereço">
  <button type="button" id="geosearch-clear" class="gs-clear" aria-label="Limpar" hidden>✕</button>
  <div id="geosearch-results" class="gs-results" hidden></div>
</form>

<div id="mapmodes" class="mapmodes">
  <div class="legend" id="legend"></div>
  <div class="mm-title" id="mm-title"></div>
  <div class="mm-grid" id="mm-grid"></div>
  <label class="mm-toggle" id="streets-row"><input type="checkbox" id="streets"> Ruas (OpenStreetMap)</label>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="attribution" class="attribution" hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores do OpenStreetMap</a></div>

<aside id="panel" class="panel" hidden>
  <header class="panel-head">
    <div>
      <div class="panel-sub" id="panel-sub"></div>
      <h1 id="panel-title"></h1>
    </div>
    <button id="panel-close" class="icon-btn" aria-label="Fechar">✕</button>
  </header>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
